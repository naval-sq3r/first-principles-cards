<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="从第一性原理与五步工作法中提炼的 50 张思考卡。"><title>从零开始 · 50 张第一性原理卡片</title>
<style>
:root{--bg:#e9edf0;--paper:#fbfaf6;--ink:#20272d;--muted:#71808a;--line:#d4dce0;--blue:#4059ad;--soft:#e9ecfa;--red:#e9614c;--yellow:#efd06f;--shadow:0 14px 38px rgba(37,52,61,.09)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif}button,input{font:inherit;color:inherit}.shell{width:min(1120px,calc(100% - 40px));margin:auto}
.masthead{padding:66px 0 38px;display:grid;grid-template-columns:1fr 230px;gap:64px;align-items:end}.eyebrow{color:var(--blue);font-size:11px;font-weight:800;letter-spacing:.18em;margin-bottom:14px}.masthead h1{font-family:"Songti SC","STSong",serif;font-size:clamp(39px,6vw,68px);line-height:1.1;letter-spacing:-.04em;margin:0 0 15px}.intro{max-width:720px;margin:0;color:var(--muted);font-size:15px;line-height:1.9}.emblem{height:150px;position:relative;display:grid;place-items:center}.orbit{width:132px;height:132px;border:1px solid #aab6bd;border-radius:50%;position:relative}.orbit:before{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:var(--red);top:14px;right:21px;box-shadow:0 0 0 5px rgba(233,97,76,.12)}.orbit:after{content:"50";position:absolute;inset:0;display:grid;place-items:center;font:italic 700 56px Georgia,serif;color:var(--blue)}.satellite{position:absolute;width:165px;height:46px;border-top:1px solid #aab6bd;transform:rotate(-24deg);top:83px}.satellite:after{content:"✦";position:absolute;right:2px;top:-12px;color:var(--yellow);font-size:20px}
.toolbar-wrap{position:sticky;top:0;z-index:20;background:rgba(233,237,240,.92);backdrop-filter:blur(14px);border-top:1px solid rgba(150,164,172,.35);border-bottom:1px solid rgba(150,164,172,.45)}.toolbar{padding:14px 0}.controls{display:flex;gap:9px;align-items:center;overflow:auto;scrollbar-width:none}.controls::-webkit-scrollbar{display:none}.search{flex:0 0 245px;height:40px;border:1px solid var(--line);border-radius:99px;background:var(--paper);padding:0 16px;outline:none}.search:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(64,89,173,.1)}.chip{border:1px solid transparent;border-radius:99px;background:transparent;color:var(--muted);padding:8px 13px;white-space:nowrap;cursor:pointer}.chip:hover{background:rgba(255,255,255,.65)}.chip.active{background:var(--blue);color:white}.summary{font-size:12px;color:var(--muted);margin:14px 3px 0}
main{padding:34px 0 80px}.wall{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.card{--accent:var(--blue);position:relative;display:flex;flex-direction:column;justify-content:space-between;text-align:left;min-height:190px;padding:21px 23px 20px;border:1px solid rgba(190,201,207,.8);border-radius:18px;background:rgba(251,250,246,.94);cursor:pointer;box-shadow:0 4px 12px rgba(37,52,61,.035);overflow:hidden;transition:.22s}.card:before{content:"";position:absolute;width:5px;height:52px;border-radius:0 5px 5px 0;background:var(--accent);left:0;top:24px}.card:hover,.card:focus-visible{transform:translateY(-3px);box-shadow:var(--shadow);border-color:#b8c3c9;outline:none}.card-top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:23px}.tag{font-size:11px;font-weight:800;color:var(--accent);letter-spacing:.08em}.no{font:700 11px ui-monospace,monospace;color:#a2adb3}.quote{font-family:"Songti SC","STSong",serif;font-size:clamp(21px,2.4vw,28px);line-height:1.48;font-weight:700;letter-spacing:-.025em;margin:0 20px 22px 0}.card-bottom{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}.line{width:46px;height:3px;border-radius:4px;background:linear-gradient(90deg,var(--accent) 0 65%,var(--yellow) 65%)}.open{opacity:0;transition:.2s}.card:hover .open,.card:focus-visible .open{opacity:1}.empty{grid-column:1/-1;text-align:center;padding:80px 20px;color:var(--muted)}
.principles{margin-top:70px;padding-top:28px;border-top:1px solid #bfc9ce}.principles-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:20px}.principles h2{font-family:"Songti SC","STSong",serif;font-size:32px;margin:0}.principles small{color:var(--muted)}.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.step{background:rgba(255,255,255,.5);border:1px solid var(--line);border-radius:12px;padding:15px 14px;min-height:92px}.step b{display:block;color:var(--red);font:700 12px ui-monospace,monospace;margin-bottom:11px}.step span{font-size:14px;font-weight:700;line-height:1.5}footer{padding:28px 0 44px;border-top:1px solid #c9d2d7;color:var(--muted);font-size:12px;line-height:1.8}.footer-inner{display:flex;justify-content:space-between;gap:30px}.motto{color:var(--blue);font-family:"Songti SC","STSong",serif;font-size:18px;font-weight:700}
.modal[hidden]{display:none}.modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:18px;background:rgba(28,36,42,.42);backdrop-filter:blur(8px)}.sheet{width:min(690px,100%);max-height:92vh;overflow:auto;background-color:var(--paper);background-image:radial-gradient(#dbe0df .8px,transparent .8px);background-size:18px 18px;border-radius:25px;box-shadow:0 25px 90px rgba(18,26,31,.3);padding:36px;position:relative}.close{position:absolute;right:17px;top:17px;border:0;width:37px;height:37px;border-radius:50%;background:white;box-shadow:0 3px 13px rgba(30,40,47,.12);cursor:pointer;color:var(--muted);font-size:20px}.modal-tag{display:inline-block;border-radius:99px;background:var(--blue);color:#fff;font-size:11px;font-weight:800;letter-spacing:.1em;padding:7px 12px;margin-bottom:23px}.sheet h2{font-family:"Songti SC","STSong",serif;font-size:clamp(29px,5vw,43px);line-height:1.38;letter-spacing:-.035em;margin:0 36px 27px 0}.insight{display:grid;grid-template-columns:90px 1fr;gap:18px;padding:20px 0;border-top:1px solid var(--line)}.insight-label{font-size:11px;letter-spacing:.12em;color:var(--blue);font-weight:800}.insight p{margin:0;line-height:1.8;font-size:15px}.action{background:var(--soft);border-radius:13px;padding:17px 18px!important}.sheet-foot{display:flex;align-items:center;justify-content:space-between;margin-top:26px;color:#98a4aa;font-size:11px}.nav{display:flex;gap:8px}.nav button{border:1px solid var(--line);background:white;border-radius:9px;padding:7px 11px;cursor:pointer}
@media(max-width:760px){.shell{width:min(100% - 28px,1120px)}.masthead{padding:42px 0 28px;grid-template-columns:1fr}.emblem{display:none}.search{flex-basis:190px}.wall{grid-template-columns:1fr}.card{min-height:165px}.quote{font-size:23px}.steps{grid-template-columns:1fr 1fr}.step:last-child{grid-column:1/-1}.footer-inner,.principles-head{align-items:start;flex-direction:column}.sheet{padding:28px 19px 22px;border-radius:20px}.insight{grid-template-columns:1fr;gap:8px}.sheet h2{margin-right:28px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style></head><body>
<header class="shell masthead"><div><div class="eyebrow">FIRST PRINCIPLES · THINKING CARDS</div><h1>从零开始，重新推导</h1><p class="intro">50 张关于认知、行动与创造的思考卡。把复杂问题拆回事实，把多余流程删到必要，再让真正重要的部分跑得更快。</p></div><div class="emblem" aria-hidden="true"><div class="orbit"></div><div class="satellite"></div></div></header>
<div class="toolbar-wrap"><div class="shell toolbar"><div class="controls"><input class="search" id="search" type="search" placeholder="搜索一句话…" aria-label="搜索卡片"><div class="controls" id="filters" aria-label="卡片分类"></div></div><div class="summary" id="summary"></div></div></div>
<main class="shell"><section class="wall" id="wall" aria-live="polite"></section><section class="principles"><div class="principles-head"><h2>五步工作法</h2><small>顺序很重要，自动化永远在最后。</small></div><div class="steps"><div class="step"><b>01</b><span>质疑每一项需求</span></div><div class="step"><b>02</b><span>删除不必要的部分</span></div><div class="step"><b>03</b><span>简化与优化</span></div><div class="step"><b>04</b><span>加快迭代周期</span></div><div class="step"><b>05</b><span>最后才自动化</span></div></div></section></main>
<footer><div class="shell footer-inner"><div class="motto">不要优化一件本应被删除的事情。</div><div>依据第一性原理与五步工作法重新提炼的原创表达，非马斯克逐字引语。</div></div></footer>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="sheet"><button class="close" id="close" aria-label="关闭">×</button><div class="modal-tag" id="modalTag"></div><h2 id="modalTitle"></h2><div class="insight"><div class="insight-label">追问自己</div><p id="question"></p></div><div class="insight"><div class="insight-label">今天怎么用</div><p class="action" id="action"></p></div><div class="sheet-foot"><span id="sheetNo"></span><div class="nav"><button id="prev">← 上一张</button><button id="next">下一张 →</button></div></div></div></div>
<script>
const groups={
"认知":["不要问别人怎么做，要问事情为什么必须这样做。","共识只能证明很多人相信，不能证明它一定正确。","真正的创新，不是换一种模仿，而是从事实重新出发。","当所有人都说“不可能”，先检查他们依据的是物理规律，还是行业习惯。","把复杂问题拆到底，答案往往比想象中简单。"],
"目标":["目标错了，效率越高，离结果越远。","不要用忙碌掩盖方向上的懒惰。","伟大的目标不是预测出来的，而是选择之后倒推出来的。","先确定什么值得实现，再考虑它容易不容易。","如果目标不能改变未来，它可能只是在消耗现在。"],
"需求":["每一项需求都必须带着提出者的名字，否则它只是无主的命令。","来自聪明人的要求，往往比普通要求更需要被质疑。","规则存在得越久，人们越容易忘记它为什么存在。","不要把历史遗留问题，误认为不可改变的客观条件。","好问题不是“怎么满足需求”，而是“这个需求是否应该存在”。"],
"删除":["删除，是所有优化中回报最高的一步。","如果从未删多过，说明你删得还不够。","最昂贵的零件，是那个原本不需要存在的零件。","真正的高手不是不断增加，而是知道什么可以不要。","每增加一个步骤，都要证明它带来的价值大于复杂性。"],
"简化":["不要优化一件本应被删除的事情。","简化不是少做一点，而是让核心价值更直接地发生。","一个流程解释得越困难，越可能藏着不必要的复杂性。","优化的对象应该是结果，而不是让旧流程看起来更漂亮。","简单不是起点，而是穿过复杂之后留下的答案。"],
"执行":["思考决定方向，行动负责把假设变成事实。","与其争论十天，不如用一天做出可以验证的版本。","第一个版本的任务不是完美，而是暴露错误。","执行力的本质，是缩短想法与反馈之间的距离。","不要等所有条件成熟，因为行动本身会创造条件。"],
"迭代":["速度不是把人逼得更快，而是让系统少一些等待。","快速犯下可逆的小错，胜过缓慢等待一个想象中的正确答案。","迭代越快，现实教育你的成本越低。","完美如果来得太晚，价值可能已经归零。","真正的速度，来自更短的流程，而不是更长的工时。"],
"风险":["如果每次尝试都成功，说明你的探索还不够深入。","失败不是创新的反面，拒绝从失败中更新才是。","不要消灭所有风险，要消灭那些无法换来认知的风险。","可逆的决定快速做，不可逆的决定想清楚再做。","最危险的失败，是系统已经失效，指标却依然漂亮。"],
"团队":["管理不是增加汇报，而是清除阻碍结果发生的摩擦。","信息应该沿最短路径流动，而不是沿职位等级旅行。","一个团队的上限，取决于它面对坏消息的速度。","不要奖励看起来很忙的人，要奖励真正消除问题的人。","好领导不会让自己成为所有决定的必经之路。"],
"未来":["先删除，再简化，再加速，最后才自动化。","自动化错误流程，只会让错误发生得更快。","技术最大的价值，不是炫耀复杂，而是让原本不可能的事成为日常。","成本不是天然存在的数字，而是材料、时间、能量与决策的总和。","未来不会因为被讨论而到来，只会因为有人把它制造出来。"]};
const guides={"认知":["这件事里，哪些是事实，哪些只是大家都这么做？","写下三个不能再拆分的事实，再从它们重新得出结论。"],"目标":["如果删掉所有面子与惯性，我真正想得到的结果是什么？","用一句话写下最终结果，再删除今天与它无关的一项安排。"],"需求":["谁提出了这个要求？它解决的原始问题还存在吗？","为当前需求补上提出者、依据和失效条件。"],"删除":["如果完全拿掉它，最坏会发生什么？","从正在做的流程中删掉一步，观察结果是否真的变差。"],"简化":["能否用一半步骤得到同样的关键结果？","把一个复杂流程画成三步，只保留价值真正发生的节点。"],"执行":["怎样用最小版本在今天验证这个判断？","做出一个可以被真实使用或反驳的最小版本。"],"迭代":["等待发生在哪里？反馈为什么来得这么晚？","把下一次反馈的时间提前一半，不增加工作时长。"],"风险":["这是不可逆风险，还是可以快速修正的小实验？","给决定写下止损线、观察指标和最早复盘时间。"],"团队":["信息在哪一层停住了？谁最接近真实问题？","让问题发现者直接与问题解决者沟通一次。"],"未来":["我是在自动化价值，还是在自动化浪费？","检查一个自动化流程：先删、再简化，最后决定是否保留。"]};
const accents=["#4059ad","#6378c5","#497b8b","#d06a50","#7d6bb0","#43826f","#be6b75","#9a7150","#526f95","#b05e48"],cards=[];let id=0;Object.entries(groups).forEach(([group,quotes],gi)=>quotes.forEach(quote=>cards.push({id:++id,group,quote,accent:accents[gi]})));
const wall=document.querySelector('#wall'),filters=document.querySelector('#filters'),search=document.querySelector('#search'),summary=document.querySelector('#summary'),modal=document.querySelector('#modal');let active='全部',current=1,lastFocus=null;
['全部',...Object.keys(groups)].forEach(name=>{const b=document.createElement('button');b.className='chip'+(name==='全部'?' active':'');b.textContent=name;b.dataset.filter=name;filters.appendChild(b)});const visible=()=>cards.filter(c=>(active==='全部'||c.group===active)&&(!search.value.trim()||c.quote.includes(search.value.trim())||c.group.includes(search.value.trim())));
function render(){const list=visible();summary.textContent=`显示 ${list.length} / 50 张卡片`;wall.innerHTML=list.length?list.map(c=>`<button class="card" data-id="${c.id}" style="--accent:${c.accent}"><div class="card-top"><span class="tag">${c.group} · PRINCIPLE</span><span class="no">N${String(c.id).padStart(2,'0')}</span></div><p class="quote">${c.quote}</p><div class="card-bottom"><span class="line"></span><span class="open">展开思考 ↗</span></div></button>`).join(''):'<div class="empty">没有找到匹配的卡片，换个关键词试试。</div>'}
function openCard(cardId){const c=cards.find(x=>x.id===cardId);if(!c)return;current=cardId;lastFocus=document.activeElement;document.querySelector('#modalTag').textContent=c.group+' · PRINCIPLE';document.querySelector('#modalTag').style.background=c.accent;document.querySelector('#modalTitle').textContent=c.quote;document.querySelector('#question').textContent=guides[c.group][0];document.querySelector('#action').textContent=guides[c.group][1];document.querySelector('#sheetNo').textContent=`N${String(c.id).padStart(2,'0')} / 50`;modal.hidden=false;document.body.style.overflow='hidden';document.querySelector('#close').focus()}function close(){modal.hidden=true;document.body.style.overflow='';lastFocus?.focus()}function move(step){const list=visible();let at=list.findIndex(c=>c.id===current);if(at<0)at=0;openCard(list[(at+step+list.length)%list.length].id)}
filters.addEventListener('click',e=>{const b=e.target.closest('[data-filter]');if(!b)return;active=b.dataset.filter;filters.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===b));render()});search.addEventListener('input',render);wall.addEventListener('click',e=>{const c=e.target.closest('[data-id]');if(c)openCard(Number(c.dataset.id))});document.querySelector('#close').onclick=close;document.querySelector('#prev').onclick=()=>move(-1);document.querySelector('#next').onclick=()=>move(1);modal.addEventListener('click',e=>{if(e.target===modal)close()});document.addEventListener('keydown',e=>{if(modal.hidden)return;if(e.key==='Escape')close();if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)});render();
</script></body></html>
